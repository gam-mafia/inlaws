# Based on https://github.com/r-lib/actions/blob/v2/examples/test-coverage.yaml
name: test-coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage
      - name: Measure coverage of base-R regression tests
        shell: Rscript {0}
        run: |
          coverage <- covr::package_coverage(
            type = "tests",
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(Sys.getenv("RUNNER_TEMP"), "coverage-library")
          )
          print(coverage)
          covr::to_cobertura(coverage, filename = "cobertura.xml")
          saveRDS(coverage, "coverage.rds")
          write.csv(as.data.frame(coverage), "coverage.csv", row.names = FALSE)
          cat(sprintf("Test coverage: %.2f%%\n", covr::percent_coverage(coverage)),
              file = Sys.getenv("GITHUB_STEP_SUMMARY"), append = TRUE)
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            cobertura.xml
            coverage.csv
            coverage.rds
          if-no-files-found: error
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-logs
          path: ${{ runner.temp }}/coverage-library
